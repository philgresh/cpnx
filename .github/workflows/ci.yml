name: CI

# One run per commit: pushes to main, and pull requests (which cover pushes to their branches).
# A bare `on: [push, pull_request]` ran every PR commit twice.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the runs it supersedes. Pushes to main are
# keyed by commit SHA instead, so every commit that lands on main still gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and complexity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - name: Complexity gate (radon, rank A/B only)
        run: |
          radon cc src/cpnx -s -a
          bad=$(radon cc src/cpnx --min C -s)
          if [ -n "$bad" ]; then echo "Complexity gate FAILED — rank C or worse:"; echo "$bad"; exit 1; fi
          echo "Complexity gate passed."

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported version blocks. A version claimed in pyproject.toml's classifiers
        # must not be able to fail invisibly — which is what `experimental` below allows, so
        # the two must never disagree. Add a prerelease here *and* to `include` as
        # `experimental: true`, and promote it to a bare entry when its classifier is claimed.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: pip install -e ".[dev]"
      # No entry sets `experimental`, so this is currently always false. It is kept as the
      # hook for the next prerelease; note it covers only pytest, so an experimental entry
      # still fails the job on an install error.
      # `-n auto` spreads the suite over the runner's cores with pytest-xdist; `worksteal` lets idle
      # workers take queued tests from busy ones, so the few long Hypothesis tests don't pile up
      # behind one worker. `--durations` keeps the slowest tests visible in the log.
      - run: pytest tests/ -n auto --dist worksteal --durations=15
        continue-on-error: ${{ matrix.experimental == true }}

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
